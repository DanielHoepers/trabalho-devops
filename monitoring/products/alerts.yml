groups:
  - name: products
    rules:
      - alert: ProductsScrapeDown
        expr: up{job=~"products-.*"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Métricas de Produtos indisponíveis em {{ $labels.environment }}'
      - alert: ProductsHighErrorRate
        expr: sum by (environment) (rate(http_requests_total{service="products-service",status=~"5.."}[5m])) / clamp_min(sum by (environment) (rate(http_requests_total{service="products-service"}[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Mais de 5% de erros em Produtos em {{ $labels.environment }}'
